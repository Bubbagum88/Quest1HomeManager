name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Check the catalog parses
        run: python3 -c "import json; c=json.load(open('catalog/catalog.json')); print(len(c['homes']), 'homes')"
      - name: Build
        run: gradle --no-daemon :app:assembleRelease
      - name: Rename
        run: cp app/build/outputs/apk/release/app-release.apk Quest1HomeManager.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Quest1HomeManager-${{ github.run_number }}
          path: Quest1HomeManager.apk
